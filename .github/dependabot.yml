version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    ignore:
      - dependency-name: "next"
        versions: [">=16.0.0"]
      - dependency-name: "@nestjs/*"
        versions: [">=12.0.0"]

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
