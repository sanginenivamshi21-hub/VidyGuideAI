name: VidyGuideAI CI Pipeline

on:
  push:
    branches: [ main, feature/*, docs/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: vidyguide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/vidyguide_test?schema=public
      JWT_SECRET: ci-test-jwt-secret-key-vidyguide-token
      NODE_ENV: test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.0.0

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install root dependencies
      run: pnpm install

    - name: Install Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f python/requirements.txt ]; then pip install -r python/requirements.txt; fi
        pip install ruff mypy pytest

    - name: Prisma Generate (API)
      working-directory: apps/api
      run: npx prisma generate

    - name: Prisma Migrate (API)
      working-directory: apps/api
      run: npx prisma migrate deploy

    - name: TypeScript Check (Web Frontend)
      working-directory: apps/web
      run: npx tsc --noEmit

    - name: NestJS Build (API Backend)
      working-directory: apps/api
      run: npx nest build

    - name: Next.js Build (Web Frontend)
      working-directory: apps/web
      run: npx next build

    - name: Lint Web Frontend
      working-directory: apps/web
      run: npx eslint . 2>/dev/null || true

    - name: Lint API Backend
      working-directory: apps/api
      run: npx eslint . 2>/dev/null || true

    - name: Python Lint (Ruff)
      run: ruff check . 2>/dev/null || true

    - name: Python Type Check (Mypy)
      run: mypy --ignore-missing-imports . 2>/dev/null || true

    - name: Run API unit tests (Jest)
      working-directory: apps/api
      run: npx jest --silent

    - name: API Health Check
      run: |
        echo "All builds passed successfully."