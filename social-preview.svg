<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow effects -->
  <circle cx="1000" cy="100" r="250" fill="#10b981" opacity="0.06"/>
  <circle cx="200" cy="500" r="200" fill="#3b82f6" opacity="0.05"/>

  <!-- Accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Logo placeholder -->
  <rect x="60" y="50" width="60" height="60" rx="14" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
  <text x="90" y="88" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="28" font-weight="700">G</text>
  <text x="130" y="88" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">VidyGuideAI</text>

  <!-- Main headline -->
  <text x="60" y="200" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Your AI-Powered Career</text>
  <text x="60" y="270" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Companion</text>

  <!-- Subtitle -->
  <text x="60" y="330" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" line-height="1.5">
    <tspan x="60" dy="0">AI Mentor · Resume Builder · Career Roadmaps · Interview Prep</tspan>
    <tspan x="60" dy="30">Skill Gap Analysis · Smart Translator · Dashboard Analytics</tspan>
  </text>

  <!-- Feature cards -->
  <rect x="60" y="400" width="160" height="80" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
  <circle cx="88" cy="430" r="14" fill="#10b981" opacity="0.2"/>
  <text x="88" y="435" text-anchor="middle" fill="#34d399" font-family="system-ui" font-size="13">3</text>
  <text x="110" y="435" fill="#e2e8f0" font-family="system-ui" font-size="13" font-weight="600">AI Providers</text>
  <text x="76" y="462" fill="#64748b" font-family="system-ui" font-size="10">Groq · Gemini · GPT</text>

  <rect x="240" y="400" width="160" height="80" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
  <circle cx="268" cy="430" r="14" fill="#3b82f6" opacity="0.2"/>
  <text x="268" y="435" text-anchor="middle" fill="#60a5fa" font-family="system-ui" font-size="13">23+</text>
  <text x="290" y="435" fill="#e2e8f0" font-family="system-ui" font-size="13" font-weight="600">Pages</text>
  <text x="256" y="462" fill="#64748b" font-family="system-ui" font-size="10">Full-featured app</text>

  <rect x="420" y="400" width="160" height="80" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
  <circle cx="448" cy="430" r="14" fill="#f59e0b" opacity="0.2"/>
  <text x="448" y="435" text-anchor="middle" fill="#fbbf24" font-family="system-ui" font-size="13">18+</text>
  <text x="470" y="435" fill="#e2e8f0" font-family="system-ui" font-size="13" font-weight="600">Endpoints</text>
  <text x="436" y="462" fill="#64748b" font-family="system-ui" font-size="10">RESTful API</text>

  <!-- Badges -->
  <g transform="translate(60, 510)">
    <rect x="0" y="0" width="110" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="14" r="4" fill="#10b981"/>
    <text x="30" y="19" fill="#94a3b8" font-family="system-ui" font-size="11">Next.js 15</text>

    <rect x="120" y="0" width="100" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="138" cy="14" r="4" fill="#3b82f6"/>
    <text x="148" y="19" fill="#94a3b8" font-family="system-ui" font-size="11">NestJS 11</text>

    <rect x="230" y="0" width="110" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="248" cy="14" r="4" fill="#a855f7"/>
    <text x="258" y="19" fill="#94a3b8" font-family="system-ui" font-size="11">PostgreSQL</text>

    <rect x="350" y="0" width="90" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="368" cy="14" r="4" fill="#ef4444"/>
    <text x="378" y="19" fill="#94a3b8" font-family="system-ui" font-size="11">Redis</text>
  </g>

  <!-- Right side decorative -->
  <g transform="translate(800, 120)">
    <rect x="0" y="0" width="120" height="120" rx="20" fill="#10b981" opacity="0.08" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
    <text x="60" y="65" text-anchor="middle" fill="#34d399" font-family="system-ui" font-size="36">AI</text>
    <text x="60" y="90" text-anchor="middle" fill="#6ee7b7" font-family="system-ui" font-size="12">Mentor</text>
  </g>

  <g transform="translate(950, 160)">
    <rect x="0" y="0" width="100" height="100" rx="20" fill="#3b82f6" opacity="0.08" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
    <text x="50" y="55" text-anchor="middle" fill="#60a5fa" font-family="system-ui" font-size="30">R</text>
    <text x="50" y="78" text-anchor="middle" fill="#93c5fd" font-family="system-ui" font-size="12">Resume</text>
  </g>

  <g transform="translate(860, 280)">
    <rect x="0" y="0" width="110" height="100" rx="20" fill="#f59e0b" opacity="0.08" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
    <text x="55" y="55" text-anchor="middle" fill="#fbbf24" font-family="system-ui" font-size="28">G</text>
    <text x="55" y="78" text-anchor="middle" fill="#fde68a" font-family="system-ui" font-size="12">Growth</text>
  </g>

  <!-- Bottom accent -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>
